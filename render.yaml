services:
  - type: web
    name: lynn-movie-recap
    env: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_FILE_MB
        value: 500
      - key: GEMINI_API_KEY
        sync: false
      - key: TTS_VOICE
        value: my-MM-ThihaNeural
