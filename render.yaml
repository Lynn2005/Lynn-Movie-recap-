services:
  - type: web
    name: lynn-movie-recap
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MAX_FILE_MB
        value: 500
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: TTS_VOICE
        value: my-MM-ThihaNeural
