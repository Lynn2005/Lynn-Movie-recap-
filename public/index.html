<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lynn Movie Recap</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="logo">LYNN <span>MOVIE RECAP</span></div><p>AI Movie Recap Studio</p></header><section class="card"><label>Gemini API Key</label><div class="keyrow"><input id="key" type="password" placeholder="Paste Gemini API key"><button id="save">Save Key</button></div><small id="saved"></small></section><section class="card"><label>Movie / Video</label><input id="video" type="file" accept="video/*"><div class="grid"><div><label>Aspect Ratio</label><select id="ratio"><option value="9:16">9:16 Vertical</option><option value="16:9">16:9 Landscape</option><option value="1:1">1:1 Square</option></select></div><div><label>Quality</label><select id="crf"><option value="26">High</option><option value="28" selected>Balanced</option><option value="30">Fast</option></select></div></div><button class="primary" id="go">🚀 Create Recap Video</button><div class="bar"><i id="bar"></i></div><pre id="status">Ready.</pre></section><section class="card"><h3>Workflow</h3><div class="steps"><span>01 Upload</span><span>02 Transcript</span><span>03 Burmese Recap</span><span>04 Render</span><span>05 Download</span></div><a id="download" class="download" hidden>⬇ Download Final MP4</a></section></main><script>const $=id=>document.getElementById(id);const key=localStorage.getItem("lynn_movie_key")||"";$("key").value=key;if(key)$("saved").textContent="✓ Key saved on this device";$("save").onclick=()=>{localStorage.setItem("lynn_movie_key",$("key").value.trim());$("saved").textContent="✓ Key saved on this device"};async function api(url,opt={}){opt.headers={...(opt.headers||{}),"x-gemini-api-key":localStorage.getItem("lynn_movie_key")||$("key").value.trim()};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}$("go").onclick=async()=>{const file=$("video").files[0];if(!file)return alert("Video ရွေးပါ");if(!localStorage.getItem("lynn_movie_key")&&!$("key").value.trim())return alert("Gemini API Key ထည့်ပါ");$("go").disabled=true;$("download").hidden=true;try{$("bar").style.width="15%";$("status").textContent="⏳ Video ကို ဖတ်နေပါတယ်...";const f=new FormData();f.append("video",file);const t=await api("/api/transcribe",{method:"POST",body:f});$("bar").style.width="40%";$("status").textContent="🤖 Burmese recap ပြုလုပ်နေပါတယ်...";const r=await api("/api/recap",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t.text})});$("bar").style.width="65%";$("status").textContent="🎬 Final MP4 render လုပ်နေပါတယ်...";const f2=new FormData();f2.append("video",file);f2.append("ratio",$("ratio").value);f2.append("crf",$("crf").value);const o=await api("/api/render",{method:"POST",body:f2});$("bar").style.width="100%";$("status").textContent="✅ ပြီးပါပြီ — Download လုပ်နိုင်ပါပြီ";$("download").href=o.download;$("download").hidden=false}catch(e){$("status").textContent="❌ "+e.message}finally{$("go").disabled=false}};</script></body></html>
